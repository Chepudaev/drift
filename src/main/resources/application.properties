spring.application.name=drift

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/driftdb
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Server Configuration
server.port=8080

# Validation Configuration
spring.validation.enabled=true

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# Logging Configuration
logging.level.com.example.drift=INFO
logging.level.org.springframework.web=DEBUG
logging.level.com.example.drift.filter=INFO
logging.level.com.example.drift.config=INFO

# JWT Configuration
jwt.secret=mySecretKey123456789012345678901234567890123456789012345678901234567890
jwt.expiration=86400000
jwt.refresh-expiration=604800000
jwt.header-name=Authorization
jwt.token-prefix=Bearer

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.openapi.version=3.0.1
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.url=/api-docs

# Enhanced OpenAPI Configuration
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.display-operation-id=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.show-extensions=true
springdoc.swagger-ui.show-common-extensions=true
springdoc.swagger-ui.deep-linking=true
springdoc.swagger-ui.supported-submit-methods=get,post,put,delete,patch,head,options

# OpenAPI Server URLs
drift.openapi.dev-url=http://localhost:8080
drift.openapi.staging-url=https://staging-api.drift.example.com
drift.openapi.prod-url=https://api.drift.example.com

# OpenAPI Documentation Settings
springdoc.swagger-ui.config-url=/api-docs/swagger-config
springdoc.swagger-ui.oauth2-redirect-url=/swagger-ui/oauth2-redirect.html
springdoc.swagger-ui.oauth2-use-pkce-with-authorization-code-grant=true